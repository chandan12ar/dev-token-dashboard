[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fluency-insights"
description = "A fully-local, zero-token-cost dashboard for your Claude Code usage."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Chandan AR" }]
dependencies = []  # standard library only, by design
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ai-fluency-insights = "ai_fluency_insights.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ai_fluency_insights.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_fluency_insights = ["web/*.html", "web/static/**/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
